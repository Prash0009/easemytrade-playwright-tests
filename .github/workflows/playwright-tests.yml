name: "⏱️ Scheduled + Push Tests"

# ─── Automatic runs only (push to main and daily schedule) ───────────────────
# For on-demand manual runs, use the "🚀 Run Tests — Manual" workflow instead.
on:
  push:
    branches: [main]
  schedule:
    # Weekdays at 6:00 AM IST (00:30 UTC)
    - cron: '30 0 * * 1-5'

env:
  APP_BASE_URL: 'https://easemytrade.in'
  BROWSER:      'chromium'
  JAVA_VERSION: '17'

# ──────────────────────────────────────────────────────────────────────────────
#  Main test job
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  test:
    name: "Playwright Tests · chromium"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # needed for gh-pages push
      pages: write

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Java ──────────────────────────────────────────────────────────────
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # ── 3. Maven cache ───────────────────────────────────────────────────────
      - name: Restore Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      # ── 4. Restore previous Allure history (enables trend graph) ─────────────
      - name: Restore Allure history from gh-pages
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git checkout origin/gh-pages -- allure-history/ 2>/dev/null || true
            if [ -d allure-history ]; then
              mkdir -p target/allure-results/history
              cp -r allure-history/. target/allure-results/history/
              echo "✅ Allure history restored ($(ls allure-history | wc -l) files)"
            fi
          fi

      # ── 5. Install Playwright browsers ───────────────────────────────────────
      - name: Install Playwright browsers
        run: |
          mvn -q exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps ${{ env.BROWSER }}"

      # ── 6. Write Allure environment file ─────────────────────────────────────
      - name: Generate allure-environment.properties
        run: |
          mkdir -p target/allure-results
          cat > target/allure-results/environment.properties <<EOF
          Application=EaseMyTrade
          Base.URL=${{ env.APP_BASE_URL }}
          Browser=${{ env.BROWSER }}
          Browser.Headless=true
          Java.Version=${{ env.JAVA_VERSION }}
          OS=${{ runner.os }}
          CI.Run.Number=${{ github.run_number }}
          CI.Run.Actor=${{ github.actor }}
          CI.Branch=${{ github.ref_name }}
          CI.Commit=${{ github.sha }}
          Playwright.Version=1.44.0
          TestNG.Version=7.9.0
          Allure.Version=2.27.0
          EOF
          echo "✅ environment.properties written"

      # ── 7. Copy categories.json into allure-results ───────────────────────────
      - name: Copy Allure categories config
        run: |
          mkdir -p target/allure-results
          cp src/test/resources/categories.json target/allure-results/categories.json
          echo "✅ categories.json copied"

      # ── 8. Run tests ──────────────────────────────────────────────────────────
      - name: Run Playwright tests (headless)
        run: |
          mvn test \
            -Dapp.base.url="${{ env.APP_BASE_URL }}" \
            -Dbrowser="${{ env.BROWSER }}" \
            -Dheadless=true \
            -Dmaven.test.failure.ignore=true \
            2>&1 | tee target/maven-output.log
        env:
          APP_BASE_URL: ${{ env.APP_BASE_URL }}

      # ── 9. Generate Allure HTML report ────────────────────────────────────────
      - name: Generate Allure HTML report
        if: always()
        run: |
          mvn -q allure:report
          echo "✅ Allure report generated at target/allure-report"
          ls target/allure-report/ | head -10

      # ── 10. Save new history for next run ─────────────────────────────────────
      - name: Persist Allure history
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if [ -d target/allure-report/history ]; then
            mkdir -p allure-history
            cp -r target/allure-report/history/. allure-history/
            echo "✅ History saved ($(ls allure-history | wc -l) files)"
          fi

      # ── 11. Publish Allure report to GitHub Pages ─────────────────────────────
      - name: Publish Allure report → GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/allure-report
          publish_branch: gh-pages
          destination_dir: reports/${{ github.run_number }}
          keep_files: true

      # ── 12. Keep history on gh-pages ──────────────────────────────────────────
      - name: Update Allure history on gh-pages
        if: always() && github.ref == 'refs/heads/main' && hashFiles('allure-history/*') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          destination_dir: allure-history
          keep_files: true

      # ── 13. Upload artifacts ──────────────────────────────────────────────────
      - name: Upload Allure Results (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ env.BROWSER }}-run${{ github.run_number }}
          path: target/allure-results/
          retention-days: 30

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ env.BROWSER }}-run${{ github.run_number }}
          path: target/allure-report/
          retention-days: 30

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-run${{ github.run_number }}
          path: target/test-logs/
          retention-days: 14
          if-no-files-found: ignore

      # ── 14. Rich job summary ──────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          REPORT_URL="https://Prash0009.github.io/easemytrade-playwright-tests/reports/${{ github.run_number }}/index.html"

          echo "# 🎯 EaseMyTrade Test Run — #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 App URL | ${{ env.APP_BASE_URL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🖥️ Browser | ${{ env.BROWSER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔖 Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 👤 Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔑 Commit | \`$(echo ${{ github.sha }} | cut -c1-7)\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Parse TestNG XML for results
          if [ -f target/surefire-reports/testng-results.xml ]; then
            TOTAL=$(grep -oP 'total="\K[0-9]+' target/surefire-reports/testng-results.xml | head -1 || echo "?")
            PASSED=$(grep -oP 'passed="\K[0-9]+' target/surefire-reports/testng-results.xml | head -1 || echo "?")
            FAILED=$(grep -oP 'failed="\K[0-9]+' target/surefire-reports/testng-results.xml | head -1 || echo "?")
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' target/surefire-reports/testng-results.xml | head -1 || echo "?")

            echo "## 📊 Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | ❌ Failed | ⏭️ Skipped | 📋 Total |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| **$PASSED** | **$FAILED** | **$SKIPPED** | **$TOTAL** |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Pass rate
            if [[ "$TOTAL" =~ ^[0-9]+$ ]] && [ "$TOTAL" -gt 0 ] && [[ "$PASSED" =~ ^[0-9]+$ ]]; then
              RATE=$(echo "scale=1; $PASSED * 100 / $TOTAL" | bc)
              echo "**Pass rate: ${RATE}%**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "## 📈 Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download \`allure-report-${{ env.BROWSER }}-run${{ github.run_number }}\` from the **Artifacts** section above and open \`index.html\` in your browser." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌍 **Live Report (GitHub Pages):** [Open Report]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> The GitHub Pages link becomes active ~60 seconds after the workflow completes." >> $GITHUB_STEP_SUMMARY

# ──────────────────────────────────────────────────────────────────────────────
#  Cross-browser matrix — main branch pushes + manual trigger
# ──────────────────────────────────────────────────────────────────────────────
  cross-browser:
    name: "Cross-browser · ${{ matrix.browser }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Install Playwright — ${{ matrix.browser }}
        run: |
          mvn -q exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps ${{ matrix.browser }}"

      - name: Write environment + categories
        run: |
          mkdir -p target/allure-results
          cp src/test/resources/categories.json target/allure-results/categories.json
          cat > target/allure-results/environment.properties <<EOF
          Application=EaseMyTrade
          Base.URL=${{ env.APP_BASE_URL }}
          Browser=${{ matrix.browser }}
          CI.Run.Number=${{ github.run_number }}
          EOF

      - name: Run tests — ${{ matrix.browser }}
        run: |
          mvn test \
            -Dapp.base.url="${{ env.APP_BASE_URL }}" \
            -Dbrowser="${{ matrix.browser }}" \
            -Dheadless=true \
            -Dmaven.test.failure.ignore=true

      - name: Upload results — ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-xbrowser-${{ matrix.browser }}-run${{ github.run_number }}
          path: target/allure-results/
          retention-days: 14
